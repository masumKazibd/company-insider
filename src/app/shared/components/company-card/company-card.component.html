<div
  class="rounded-2xl border bg-white p-6 shadow-sm transition-all hover:-translate-y-1 hover:shadow-lg">

  <!-- Header -->

  <div class="flex items-center gap-4">

    <img
      [src]="company().company.logo"
      class="h-16 w-16 rounded-xl object-cover"
      alt="logo">

    <div>

      <h2 class="text-lg font-bold">

        {{ company().company.name }}

      </h2>

      <p class="text-sm text-gray-500">

        {{ company().company.headquarters.city }}

      </p>

    </div>

  </div>

  <!-- Tech -->

  <div class="mt-6 flex flex-wrap gap-2">

    @for (tech of company().technology.frameworks; track tech) {

      <span
        class="rounded-full bg-indigo-100 px-3 py-1 text-sm text-indigo-600">

        {{ tech }}

      </span>

    }

  </div>

  <!-- Work -->

  <div class="mt-5 space-y-2 text-sm">

    <p>

      🏠

      {{ company().work.workModels?.join(', ') }}

    </p>

    <p>

      📅

      {{ company().work.weekend?.join(', ') }}

    </p>

    <p>

      👥

      {{ company().company.employeeSize }}

    </p>

  </div>

  <a
    [routerLink]="['/company', company().id]"
    class="mt-6 inline-flex font-semibold text-indigo-600">

    View Details →

  </a>

</div>
